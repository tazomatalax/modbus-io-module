; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; =============================================================================
; MULTI-DEVICE CONFIGURATION
; =============================================================================
; Each [env:picoN] environment corresponds to a specific Pico device.
; Device-specific configs are stored in: configs/picoN/
;   - config.json      (network settings, hostname)
;   - io_config.json   (IO pin configuration)
;   - sensors.json     (sensor configuration)
;
; Shared web UI files are in: data/
;   - index.html, script.js, styles.css, favicon.ico
;
; Build/Upload a specific device:
;   pio run -e pico1 -t uploadfs   # Upload filesystem for pico1
;   pio run -e pico1 -t upload     # Upload firmware for pico1
;
; The pre-build script (merge_config.py) merges device configs with shared UI.
; =============================================================================

[platformio]
default_envs = pico1

; -----------------------------------------------------------------------------
; Common settings inherited by all Pico environments
; -----------------------------------------------------------------------------
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 512kmax
board_build.arduino.earlephilhower.usb_manufacturer = Peake Electronic Innovation
board_build.arduino.earlephilhower.usb_product = Modbus TCP IO Module
board_build.arduino.earlephilhower.usb_vid = 0x04D8
board_build.arduino.earlephilhower.usb_pid = 0xEB64
monitor_speed = 115200
build_flags = 
	-DLWIP_OPEN_SRC
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
lib_deps = 
	https://github.com/Atlas-Scientific/Ezo_I2c_lib.git
	arduino-libraries/ArduinoModbus
	bblanchon/ArduinoJson
	https://github.com/JAndrassy/Ethernet.git
	arduino-libraries/ArduinoRS485
	adafruit/Adafruit LIS3DH
	adafruit/Adafruit BusIO
	adafruit/Adafruit Unified Sensor
extra_scripts = pre:scripts/merge_config.py

; -----------------------------------------------------------------------------
; Per-device environments
; Each uses configs/picoN/ for device-specific JSON files
; -----------------------------------------------------------------------------
[env:pico1]
; Cold Buffer to Cold Process Pump - 192.168.100.10
custom_config_dir = configs/pico1

[env:pico2]
; Motor on Cold Process Tank - 192.168.100.20
custom_config_dir = configs/pico2

[env:pico3]
; Cold Buffer Tank - 192.168.100.30
custom_config_dir = configs/pico3

[env:pico4]
; Hot Process Tank - 192.168.100.40
custom_config_dir = configs/pico4

[env:pico5]
; Dewatering Centrifuge - 192.168.100.50
custom_config_dir = configs/pico5

[env:pico6]
; Hot Buffer Tank - 192.168.100.60
custom_config_dir = configs/pico6

